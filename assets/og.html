<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:'DejaVu Sans',sans-serif;color:#f6f1e7}
body{background:linear-gradient(135deg,#4a4239 0%,#3a332c 60%,#2a2622 100%)}
.plate{position:absolute;right:70px;top:95px;width:300px;height:300px;border-radius:40px;background:#f6f1e7;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.plate img{max-width:250px;max-height:250px;object-fit:contain}
.plate.icon{background:transparent;box-shadow:none}
.plate.icon img{max-width:300px;max-height:300px}
.text{position:absolute;right:420px;left:70px;top:110px;text-align:right}
.name{font-size:66px;font-weight:700;line-height:1.15;text-wrap:balance}
.sub{font-size:40px;margin-top:14px;opacity:.95}
.tag{font-size:28px;margin-top:26px;opacity:.85;line-height:1.35}
.url{position:absolute;left:70px;right:70px;bottom:44px;font-size:26px;opacity:.8;direction:ltr;text-align:left}
.chip{position:absolute;right:70px;bottom:44px;background:#7a1d2a;color:#fff3e3;border-radius:14px;padding:10px 24px;font-size:26px;font-weight:700}
</style></head><body>
<div id="plate" class="plate"><img id="logo" src=""></div>
<div class="text"><div class="name" id="name"></div><div class="sub">לוח המנינים</div><div class="tag">המנין הבא, כל המנינים לפי חדרים, זמני היום</div></div>
<div class="chip">מנין הבא · ספירה לאחור</div>
<div class="url" id="url"></div>
</body></html>
