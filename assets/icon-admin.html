<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
/* The back end's own icon: the board's icon in the back end's navy, with a gear where the minyan stands, so the two shortcuts are told apart at a glance. */
html,body{margin:0;width:512px;height:512px;background:transparent;overflow:hidden}
.bg{position:absolute;inset:0;background:linear-gradient(180deg,#2a4d86,#1a3158);border-radius:0}
.bg.round{border-radius:110px}
.tile{position:absolute;left:76px;top:86px;width:360px;height:340px;background:linear-gradient(180deg,#fbf7ee,#eae0cb);border-radius:46px;box-shadow:inset 0 3px 0 rgba(255,255,255,.7),0 10px 30px rgba(0,0,0,.35)}
.gear{position:absolute;left:50%;top:46%;width:236px;height:236px;transform:translate(-50%,-50%)}
.bar{position:absolute;left:92px;right:92px;bottom:40px;height:14px;border-radius:7px;background:#c9a449}
.maskable .tile{left:102px;top:106px;width:308px;height:300px;border-radius:40px}
.maskable .gear{width:200px;height:200px}.maskable .bar{left:80px;right:80px;bottom:34px;height:12px}
</style></head><body><div id="bg" class="bg"></div><div id="t" class="tile">
<svg class="gear" viewBox="-100 -100 200 200" aria-hidden="true"><g fill="#1f3a68"><circle r="64"/>
<rect x="-18" y="-96" width="36" height="44" rx="8"/><rect x="-18" y="-96" width="36" height="44" rx="8" transform="rotate(45)"/><rect x="-18" y="-96" width="36" height="44" rx="8" transform="rotate(90)"/><rect x="-18" y="-96" width="36" height="44" rx="8" transform="rotate(135)"/>
<rect x="-18" y="-96" width="36" height="44" rx="8" transform="rotate(180)"/><rect x="-18" y="-96" width="36" height="44" rx="8" transform="rotate(225)"/><rect x="-18" y="-96" width="36" height="44" rx="8" transform="rotate(270)"/><rect x="-18" y="-96" width="36" height="44" rx="8" transform="rotate(315)"/></g>
<circle r="27" fill="#f4eddc"/></svg><div class="bar"></div></div></body></html>
