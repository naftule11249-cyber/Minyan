<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>
html,body{margin:0;width:512px;height:512px;background:transparent;overflow:hidden}
.bg{position:absolute;inset:0;background:linear-gradient(180deg,#2d4b82,#223b68);border-radius:0}
.bg.round{border-radius:110px}
.tile{position:absolute;left:76px;top:86px;width:360px;height:340px;background:linear-gradient(180deg,#7f1f2d,#5e1420);border-radius:46px;box-shadow:inset 0 3px 0 rgba(255,255,255,.18),0 10px 30px rgba(0,0,0,.35)}
.room{position:absolute;top:34px;left:0;right:0;text-align:center;color:#ffe9d2;font:700 54px 'DejaVu Sans',sans-serif}
.time{position:absolute;top:104px;left:0;right:0;text-align:center;color:#fff6e8;font:700 150px 'DejaVu Sans',sans-serif;letter-spacing:-6px;font-variant-numeric:tabular-nums}
.hodu{position:absolute;top:272px;left:0;right:0;text-align:center;color:#ffd9c0;font:40px 'DejaVu Sans',sans-serif}
.badge{position:absolute;top:64px;left:80px;background:#1e7a3a;color:#fff;font:700 40px 'DejaVu Sans',sans-serif;padding:4px 26px;border-radius:999px;border:4px solid #f6efe2}
.maskable .tile{left:102px;top:106px;width:308px;height:300px;border-radius:40px}
.maskable .room{font-size:46px;top:26px}.maskable .time{font-size:128px;top:88px}.maskable .hodu{font-size:34px;top:238px}.maskable .badge{display:none}
</style></head><body><div id="bg" class="bg"></div><div id="t" class="tile"><div class="room">מנין</div><div class="time">7:15</div><div class="hodu">הודו 7:25</div></div><div id="b" class="badge">הבא</div></body></html>
